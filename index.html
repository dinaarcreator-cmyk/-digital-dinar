<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Dinar - Sikka</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}input{padding:12px;width:85%;max-width:320px;margin:8px;border-radius:10px;border:none}button{padding:12px 22px;background:#facc15;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px}.card{background:#1e293b;padding:20px;border-radius:16px;max-width:400px;margin:20px auto}</style>
</head><body>
<h1>Digital Dinar</h1><p>1 Sikka = 1 Rupee</p>
<div class="card" id="authBox">
<h2>Login / Signup</h2>
<input id="email" type="email" placeholder="Enter your Email"><br>
<button onclick="sendOTP()">Send OTP</button><br>
<input id="otp" type="text" placeholder="Enter 6-digit OTP from Email"><br>
<button onclick="verifyOTP()">Verify OTP & Login</button>
<p id="msg"></p>
</div>
<div class="card" id="walletBox" style="display:none">
<h2>Welcome <span id="userEmail"></span></h2>
<h1><span id="balance">0</span> Sikka</h1>
<p>= Rs <span id="rupees">0</span></p>
<button onclick="mine()">Mine +10 Sikka</button><br>
<button onclick="logout()">Logout</button>
<p id="wmsg"></p>
</div>
<script>
const SUPABASE_URL = "https://jthhnynzdxhpnqwtzsal.supabase.co";
const SUPABASE_KEY = "sb_publishable_AstKI4bcvIQAbrEZbVT8Jw_YrH8hlkm";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
async function sendOTP(){
  const email = document.getElementById('email').value.trim();
  if(!email) return alert('Email pettu bro');
  const {error} = await supabaseClient.auth.signInWithOtp({email});
  if(error) document.getElementById('msg').innerText = error.message;
  else document.getElementById('msg').innerText = 'OTP email ki pampam bro, check cheyyi!';
}
async function verifyOTP(){
  const email = document.getElementById('email').value.trim();
  const token = document.getElementById('otp').value.trim();
  const {data, error} = await supabaseClient.auth.verifyOtp({email, token, type:'email'});
  if(error) return document.getElementById('msg').innerText = error.message;
  currentUser = data.user;
  await loadWallet();
}
async function loadWallet(){
  const {data} = await supabaseClient.from('wallets').select('*').eq('user_id', currentUser.id).single();
  let bal = 0;
  if(!data){
    bal = (currentUser.email === 'NEE-REAL-EMAIL@GMAIL.COM') ? 3150000 : 0;
    await supabaseClient.from('wallets').insert({user_id: currentUser.id, email: currentUser.email, balance: bal});
  } else bal = data.balance;
  document.getElementById('authBox').style.display='none';
  document.getElementById('walletBox').style.display='block';
  document.getElementById('userEmail').innerText = currentUser.email;
  document.getElementById('balance').innerText = bal;
  document.getElementById('rupees').innerText = bal;
  window._bal = bal;
}
async function mine(){
  window._bal += 10;
  await supabaseClient.from('wallets').update({balance: window._bal}).eq('user_id', currentUser.id);
  document.getElementById('balance').innerText = window._bal;
  document.getElementById('rupees').innerText = window._bal;
  document.getElementById('wmsg').innerText = '+10 Sikka mined!';
}
async function logout(){ await supabaseClient.auth.signOut(); location.reload(); }
</script></body></html>
